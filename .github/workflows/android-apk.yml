name: Mobile - build Android APK

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      # Baked into the JS bundle. Set the API_URL repository variable once the API is deployed.
      EXPO_PUBLIC_API_URL: ${{ vars.API_URL || 'https://kovi-api.onrender.com' }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.GOOGLE_ANDROID_CLIENT_ID }}
      EXPO_PUBLIC_INSTAGRAM_APP_ID: ${{ vars.INSTAGRAM_APP_ID }}
      # Without a Maps key the map shows no tiles (the route still draws). Add GOOGLE_MAPS_ANDROID_KEY as a secret.
      GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit

      - name: Optional production keystore (from ANDROID_KEYSTORE_BASE64 secret)
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        id: apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME="kovi-${VERSION}-${GITHUB_SHA::7}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ runner.temp }}/${{ steps.apk.outputs.name }}

      - name: Publish to GitHub Releases ("android-latest" is always the newest build)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Kovi Android ${{ steps.apk.outputs.version }} (${{ github.sha }})
          body: |
            Android APK built from `${{ github.sha }}`.
            API: `${{ env.EXPO_PUBLIC_API_URL }}`

            Install: download the `.apk` on an Android phone, open it and allow installing from this source.
          files: ${{ runner.temp }}/${{ steps.apk.outputs.name }}
          prerelease: true
          make_latest: false
