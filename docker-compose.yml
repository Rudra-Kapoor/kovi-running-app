# Local development stack: PostgreSQL + API.
#   docker compose up --build
# API: http://localhost:3000  (Swagger at /docs)   Admin panel: see admin/README.md
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kovi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: development
      PUBLIC_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgres@db:5432/kovi?schema=public
      JWT_SECRET: local-dev-secret-change-me
      ADMIN_EMAIL: admin@kovi.app
      ADMIN_PASSWORD: ChangeMe123!
      STORAGE_DRIVER: db
      MAIL_DRIVER: console
    ports:
      - "3000:3000"

volumes:
  pgdata:
