# Render Blueprint - one-click deploy of the API + PostgreSQL (free tier).
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: kovi-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: kovi-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_URL
        value: https://kovi-api.onrender.com
      - key: CORS_ORIGINS
        value: https://rudra-kapoor.github.io
      - key: ADMIN_EMAIL
        value: admin@kovi.app
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: STORAGE_DRIVER
        value: db
      - key: MAIL_DRIVER
        value: console
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: APPLE_BUNDLE_ID
        value: com.kovi.running

databases:
  - name: kovi-db
    plan: free
    databaseName: kovi
    user: kovi
